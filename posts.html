<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커뮤니티 게시물 전체보기 | 김프원</title>
<meta name="description" content="김프원 커뮤니티에 올라온 게시물을 한곳에서 모두 모아 보는 페이지입니다. 카테고리별 필터와 최신순·인기순·댓글순 정렬로 전체 글을 확인할 수 있습니다.">
<link rel="canonical" href="https://kimpwon.com/posts.html">
<link rel="icon" href="/favicon.ico">
<style>
:root{--bg:#f7f8fa;--card:#ffffff;--text:#191c20;--muted:#6b7280;--line:#e4e7ec;--accent:#2563eb;--hot:#e5484d;--pinbg:#fdf3e7;--pin:#b25e09}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 48px}
header{padding:8px 0 6px}
.logo{font-size:22px;font-weight:600;letter-spacing:-.5px;color:var(--text);text-decoration:none}
h1{font-size:23px;margin:10px 0 6px;line-height:1.4}
.lead{color:var(--muted);margin:0 0 18px;font-size:14px}
.lead a{color:var(--accent);text-decoration:none;font-weight:600}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.chips button{min-height:32px;padding:5px 12px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.toolbar select{min-height:32px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;font:inherit;font-size:13px;padding:4px 8px}
.count{color:var(--muted);font-size:13px;margin:8px 2px 10px}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;color:inherit;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--bg)}
.row.pin{background:var(--pinbg)}
.thumb{flex:none;width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--bg);border:1px solid var(--line)}
.thumb-init{flex:none;width:44px;height:44px;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);font-size:17px;overflow:hidden}
.thumb-init img{width:100%;height:100%;object-fit:cover}
.main{flex:1;min-width:0}
.tline{display:flex;align-items:center;gap:6px;min-width:0}
.cat{flex:none;font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:1px 7px;background:var(--bg)}
.pinbdg{flex:none;font-size:11px;font-weight:700;color:#fff;background:var(--pin);border-radius:999px;padding:1px 7px}
.hotbdg{flex:none;font-size:11px;font-weight:700;color:#fff;background:var(--hot);border-radius:999px;padding:1px 7px}
.title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--muted);font-size:12px;margin-top:2px}
.side{flex:none;color:var(--muted);font-size:12px;text-align:right;white-space:nowrap}
.side b{color:var(--text);font-weight:600}
.more{display:block;width:100%;margin-top:12px;min-height:44px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.state{padding:34px 16px;text-align:center;color:var(--muted);font-size:14px}
.state button{margin-top:10px;min-height:38px;padding:6px 16px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(10,12,16,.55);display:flex;align-items:flex-start;justify-content:center;padding:22px 12px;overflow-y:auto;z-index:50}
.ov[hidden]{display:none}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:680px;width:100%;padding:22px 20px;margin:auto 0}
.sheet h2{font-size:19px;margin:0 34px 6px 0;line-height:1.45}
.smeta{color:var(--muted);font-size:13px;margin:0 0 14px}
.simg{width:100%;border-radius:10px;margin:0 0 10px;display:block}
.sbody{white-space:pre-wrap;word-break:break-word;font-size:15px;margin:0 0 18px}
.xbtn{float:right;width:34px;height:34px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;font-size:16px;cursor:pointer}
.clist{border-top:1px solid var(--line);padding-top:12px}
.clist h3{font-size:14px;margin:0 0 10px}
.cmt{padding:8px 0;border-bottom:1px solid var(--line)}
.cmt:last-child{border-bottom:0}
.cmt .cn{font-size:13px;font-weight:700}
.cmt .ct{font-size:14px;white-space:pre-wrap;word-break:break-word}
.cmt .cd{color:var(--muted);font-size:12px}
.cmt.reply{margin-left:22px;padding-left:10px;border-left:2px solid var(--line)}
.cempty{color:var(--muted);font-size:13px}
footer{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);font-size:14px}
footer nav{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:12px}
footer a{color:var(--accent);text-decoration:none}
.copy{color:var(--muted);font-size:13px}
@media (prefers-color-scheme: dark){
:root{--bg:#14161a;--card:#1e2126;--text:#e9ebee;--muted:#9aa1ab;--line:#2d3138;--accent:#7aa2ff;--pinbg:#2b2118;--pin:#e09543}
}
</style>
</head>
<body>
<div class="wrap">
<header><a class="logo" href="https://kimpwon.com">kimpwon</a></header>
<main>
<h1>커뮤니티 게시물</h1>
<p class="lead">김프원 커뮤니티에 올라온 글을 모두 모아 보는 페이지예요. 글쓰기와 댓글은 <a href="https://kimpwon.com">김프원 커뮤니티 탭</a>에서 할 수 있어요.</p>

<div class="toolbar">
<div class="chips" id="chips"></div>
<select id="sort" aria-label="정렬">
<option value="latest">최신순</option>
<option value="popular">인기순</option>
<option value="comments">댓글순</option>
</select>
</div>
<p class="count" id="count"></p>
<div class="list" id="list"><div class="state" id="state">글을 불러오는 중이에요…</div></div>
<button type="button" class="more" id="more" hidden>더 보기</button>
</main>
<footer>
<nav>
<a href="/guide.html">가이드</a>
<a href="/privacy.html">개인정보처리방침</a>
<a href="/terms.html">이용약관</a>
</nav>
<div class="copy">© 2026 kimpwon</div>
</footer>
</div>

<div class="ov" id="ov" hidden>
<div class="sheet" role="dialog" aria-modal="true">
<button type="button" class="xbtn" id="xbtn" aria-label="닫기">×</button>
<h2 id="stitle"></h2>
<p class="smeta" id="smeta"></p>
<div id="simgs"></div>
<p class="sbody" id="sbody"></p>
<div class="clist">
<h3 id="chead">댓글</h3>
<div id="cmts"></div>
</div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
(function(){
"use strict";
var FIREBASE_CONFIG={apiKey:"AIzaSyCK_8KrdL-JkTn7UmFz_xsDW4rTTX8Hcj8",authDomain:"kimpwon.com",databaseURL:"https://jabjunet-default-rtdb.firebaseio.com",projectId:"jabjunet",storageBucket:"jabjunet.firebasestorage.app",messagingSenderId:"518844585539",appId:"1:518844585539:web:8ab1132490e672dd8366f6"};
var CAT_CODES={free:"자유",stock:"주식",coin:"코인",qna:"질문"};
var DEFAULT_CATS=["자유","주식","코인","질문"];
var cmCats=DEFAULT_CATS.slice();
var posts=[],filter="전체",sortMode="latest",shown=30;
var PAGE=30;
var listEl=document.getElementById("list"),chipsEl=document.getElementById("chips"),
    sortEl=document.getElementById("sort"),countEl=document.getElementById("count"),
    moreBtn=document.getElementById("more"),
    ov=document.getElementById("ov"),stitle=document.getElementById("stitle"),
    smeta=document.getElementById("smeta"),simgs=document.getElementById("simgs"),
    sbody=document.getElementById("sbody"),chead=document.getElementById("chead"),
    cmtsEl=document.getElementById("cmts");

function firstCat(){return cmCats.length?cmCats[0]:"자유"}
function normCat(c){
  if(typeof c!=="string")return firstCat();
  c=c.trim(); if(!c)return firstCat();
  if(CAT_CODES[c])c=CAT_CODES[c];
  else{var lc=c.toLowerCase(); if(CAT_CODES[lc])c=CAT_CODES[lc];}
  return cmCats.indexOf(c)>=0?c:firstCat();
}
function catOf(p){return normCat(p&&typeof p.cat==="string"?p.cat:"")}
function likeN(p){return (p&&typeof p.likes==="number"&&p.likes>0)?p.likes:0}
function cmtN(p){
  if(p&&typeof p.cmtCount==="number"&&p.cmtCount>0)return p.cmtCount;
  if(p&&p.comments&&typeof p.comments==="object")return Object.keys(p.comments).length;
  return 0;
}
function imgsOf(p){
  var out=[];
  function push(s){if(typeof s==="string"&&s)out.push(s)}
  if(p){
    if(Object.prototype.toString.call(p.imgs)==="[object Array]"){p.imgs.forEach(push)}
    else if(p.imgs&&typeof p.imgs==="object"){
      Object.keys(p.imgs).sort(function(a,b){return (parseInt(a,10)||0)-(parseInt(b,10)||0)}).forEach(function(k){push(p.imgs[k])});
    }
    if(!out.length)push(p.img);
  }
  return out;
}
function pad(n){return (n<10?"0":"")+n}
function fmtDay(ts){if(!ts)return "";var d=new Date(ts);return pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function fmtFull(ts){
  if(!ts)return "";
  var d=new Date(ts);
  return d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일 "+pad(d.getHours())+":"+pad(d.getMinutes());
}
function visiblePosts(){
  var arr=posts.filter(function(p){return !p.pin&&(filter==="전체"||catOf(p)===filter)});
  arr.sort(function(a,b){
    if(sortMode==="popular"){
      var d=likeN(b)-likeN(a); if(d)return d;
      var dv=(b.views||0)-(a.views||0); if(dv)return dv;
      return (b.ts||0)-(a.ts||0);
    }
    if(sortMode==="comments"){
      var dc=cmtN(b)-cmtN(a); if(dc)return dc;
      return (b.ts||0)-(a.ts||0);
    }
    return (b.ts||0)-(a.ts||0);
  });
  return arr;
}
function pinnedPosts(){
  var arr=posts.filter(function(p){return p.pin&&(filter==="전체"||catOf(p)===filter)});
  arr.sort(function(a,b){
    var d=(b.pinTs||0)-(a.pinTs||0); if(d)return d;
    return (b.ts||0)-(a.ts||0);
  });
  return arr.slice(0,5);
}
function renderChips(){
  chipsEl.textContent="";
  ["전체"].concat(cmCats).forEach(function(name){
    var b=document.createElement("button");
    b.type="button"; b.textContent=name;
    b.setAttribute("aria-pressed",String(filter===name));
    b.addEventListener("click",function(){filter=name;shown=PAGE;renderChips();render()});
    chipsEl.appendChild(b);
  });
}
function makeThumb(p){
  var imgs=imgsOf(p);
  var src=imgs.length?imgs[0]:(typeof p.photo==="string"?p.photo:"");
  if(src){
    var im=document.createElement("img");
    im.className="thumb"; im.src=src; im.alt=""; im.referrerPolicy="no-referrer"; im.loading="lazy";
    im.addEventListener("error",function(){
      var d=document.createElement("div"); d.className="thumb-init";
      d.textContent=(p.name||"?").slice(0,1);
      im.replaceWith(d);
    });
    return im;
  }
  var d=document.createElement("div"); d.className="thumb-init";
  d.textContent=(p.name||"?").slice(0,1);
  return d;
}
function makeRow(p,isPin){
  var row=document.createElement("button");
  row.type="button"; row.className="row"+(isPin?" pin":"");
  row.appendChild(makeThumb(p));
  var main=document.createElement("div"); main.className="main";
  var tl=document.createElement("div"); tl.className="tline";
  if(isPin){
    var pb=document.createElement("span"); pb.className="pinbdg"; pb.textContent="공지"; tl.appendChild(pb);
  }else{
    var cb=document.createElement("span"); cb.className="cat"; cb.textContent=catOf(p); tl.appendChild(cb);
  }
  if(cmtN(p)>=3||likeN(p)>=3){
    var hb=document.createElement("span"); hb.className="hotbdg"; hb.textContent="HOT"; tl.appendChild(hb);
  }
  var t=document.createElement("span"); t.className="title"; t.textContent=p.title||"(제목 없음)";
  tl.appendChild(t);
  main.appendChild(tl);
  var meta=document.createElement("div"); meta.className="meta";
  meta.textContent="조회 "+(p.views||0)+" · 좋아요 "+likeN(p)+" · 댓글 "+cmtN(p);
  main.appendChild(meta);
  row.appendChild(main);
  var side=document.createElement("div"); side.className="side";
  var nm=document.createElement("b"); nm.textContent=p.name||"익명";
  side.appendChild(nm);
  side.appendChild(document.createTextNode("  "+fmtDay(p.ts)));
  row.appendChild(side);
  row.addEventListener("click",function(){openPost(p)});
  return row;
}
function render(){
  var pins=pinnedPosts(),arr=visiblePosts();
  listEl.textContent="";
  pins.forEach(function(p){listEl.appendChild(makeRow(p,true))});
  var slice=arr.slice(0,shown);
  slice.forEach(function(p){listEl.appendChild(makeRow(p,false))});
  if(!pins.length&&!slice.length){
    var e=document.createElement("div"); e.className="state"; e.textContent="아직 글이 없어요.";
    listEl.appendChild(e);
  }
  countEl.textContent="전체 "+arr.length+"개 글";
  moreBtn.hidden=arr.length<=shown;
}
function openPost(p){
  stitle.textContent=p.title||"(제목 없음)";
  smeta.textContent=(p.name||"익명")+" · "+fmtFull(p.ts)+" · 조회 "+(p.views||0)+" · 좋아요 "+likeN(p);
  simgs.textContent="";
  imgsOf(p).forEach(function(src){
    var im=document.createElement("img");
    im.className="simg"; im.src=src; im.alt=""; im.referrerPolicy="no-referrer";
    simgs.appendChild(im);
  });
  sbody.textContent=p.body||"";
  renderCmts(p);
  ov.hidden=false;
  document.body.style.overflow="hidden";
}
function closePost(){ov.hidden=true;document.body.style.overflow=""}
function renderCmts(p){
  cmtsEl.textContent="";
  var raw=(p.comments&&typeof p.comments==="object")?p.comments:{};
  var arr=Object.keys(raw).map(function(k){
    var v=raw[k]||{};
    return {key:k,text:String(v.text||""),name:String(v.name||"익명"),parent:String(v.parent||""),ts:(typeof v.ts==="number"?v.ts:0)};
  });
  arr.sort(function(a,b){return (a.ts||0)-(b.ts||0)});
  chead.textContent="댓글 "+arr.length;
  if(!arr.length){
    var e=document.createElement("p"); e.className="cempty"; e.textContent="아직 댓글이 없습니다.";
    cmtsEl.appendChild(e); return;
  }
  var byKey={},kids={};
  arr.forEach(function(c){byKey[c.key]=c});
  arr.forEach(function(c){
    var pk=(c.parent&&byKey[c.parent])?c.parent:"";
    if(!kids[pk])kids[pk]=[];
    kids[pk].push(c);
  });
  function addCmt(c,isReply){
    var d=document.createElement("div"); d.className="cmt"+(isReply?" reply":"");
    var n=document.createElement("span"); n.className="cn"; n.textContent=c.name;
    var dt=document.createElement("span"); dt.className="cd"; dt.textContent="  "+fmtDay(c.ts);
    var tx=document.createElement("div"); tx.className="ct"; tx.textContent=c.text;
    d.appendChild(n); d.appendChild(dt); d.appendChild(tx);
    cmtsEl.appendChild(d);
    (kids[c.key]||[]).forEach(function(k){addCmt(k,true)});
  }
  (kids[""]||[]).forEach(function(c){addCmt(c,false)});
}
sortEl.addEventListener("change",function(){sortMode=sortEl.value;shown=PAGE;render()});
moreBtn.addEventListener("click",function(){shown+=PAGE;render()});
document.getElementById("xbtn").addEventListener("click",closePost);
ov.addEventListener("click",function(e){if(e.target===ov)closePost()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!ov.hidden)closePost()});

function fail(){
  listEl.textContent="";
  var e=document.createElement("div"); e.className="state";
  e.textContent="글을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.";
  var b=document.createElement("button"); b.type="button"; b.textContent="다시 시도";
  b.addEventListener("click",function(){location.reload()});
  e.appendChild(document.createElement("br")); e.appendChild(b);
  listEl.appendChild(e);
}

try{
  firebase.initializeApp(FIREBASE_CONFIG);
  var db=firebase.database();
  db.ref("cmConfig/cats").once("value").then(function(snap){
    var v=snap.val();
    if(v&&typeof v==="object"){
      var arr=Object.prototype.toString.call(v)==="[object Array]"?v:Object.keys(v).sort().map(function(k){return v[k]});
      arr=arr.filter(function(x){return typeof x==="string"&&x.trim()});
      if(arr.length)cmCats=arr;
    }
  }).catch(function(){}).then(function(){
    renderChips();
    return db.ref("posts").once("value");
  }).then(function(snap){
    var val=snap.val()||{};
    posts=Object.keys(val).map(function(k){
      var p=val[k]||{}; p.key=k; return p;
    });
    render();
  }).catch(function(){fail()});
}catch(e){fail()}
})();
</script>
</body>
</html>
