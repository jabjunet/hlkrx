    if(sortMode==="comments"){var dc=cmtN(b)-cmtN(a); if(dc)return dc; return (b.ts||0)-(a.ts||0)}
    if(sortMode==="views"){var dw=(b.views||0)-(a.views||0); if(dw)return dw; return (b.ts||0)-(a.ts||0)}
    return (b.ts||0)-(a.ts||0);
  });
  return arr;
}
function pinnedPosts(){
  var arr=posts.filter(function(p){return p.pin&&(filter==="전체"||catOf(p)===filter)&&!tagFilter&&matchQuery(p)});
  arr.sort(function(a,b){var d=(b.pinTs||0)-(a.pinTs||0); if(d)return d; return (b.ts||0)-(a.ts||0)});
  return arr.slice(0,5);
}
function renderChips(){
  chipsEl.textContent="";
  ["전체"].concat(cmCats).forEach(function(name){
    var b=document.createElement("button");
    b.type="button"; b.textContent=name;
    b.setAttribute("aria-pressed",String(filter===name));
    b.addEventListener("click",function(){filter=name;shown=PAGE;renderChips();render()});
    chipsEl.appendChild(b);
  });
}
function renderHot(){
  var hot=posts.filter(function(p){return !p.pin&&likeN(p)>=3});
  hot.sort(function(a,b){var d=likeN(b)-likeN(a); if(d)return d; return (b.ts||0)-(a.ts||0)});
  hot=hot.slice(0,6);
  var wrap=$("hotWrap"),row=$("hotRow");
  if(!hot.length){wrap.hidden=true;return}
  wrap.hidden=false; row.textContent="";
  hot.forEach(function(p){
    var c=document.createElement("button"); c.type="button"; c.className="hotcard";
    var h=document.createElement("div"); h.className="hc"; h.textContent="♥ "+likeN(p);
    var t=document.createElement("div"); t.className="ht"; t.textContent=p.title||"(제목 없음)";
    var m=document.createElement("div"); m.className="hm";
    m.textContent=catOf(p)+(tagOf(p)?" · $"+tagOf(p):"")+" · 댓글 "+cmtN(p)+" · "+ago(p.ts);
    c.appendChild(h); c.appendChild(t); c.appendChild(m);
    c.addEventListener("click",function(){openPost(p.key)});
    row.appendChild(c);
  });
}
function makeThumb(p){
  var imgs=imgsOf(p);
  var src=imgs.length?imgs[0]:(typeof p.photo==="string"?p.photo:"");
  if(src){
    var im=document.createElement("img");
    im.className="thumb"; im.src=src; im.alt=""; im.referrerPolicy="no-referrer"; im.loading="lazy";
    im.addEventListener("error",function(){
      var d=document.createElement("div"); d.className="thumb-init";
      d.textContent=(p.name||"?").slice(0,1); im.replaceWith(d);
    });
    return im;
  }
  var d=document.createElement("div"); d.className="thumb-init";
  d.textContent=(p.name||"?").slice(0,1);
  return d;
}
function makeRow(p,isPin){
  var row=document.createElement("button");
  row.type="button"; row.className="row"+(isPin?" pin":"");
  row.appendChild(makeThumb(p));
  var main=document.createElement("div"); main.className="main";
  var tl=document.createElement("div"); tl.className="tline";
  if(isPin){
    var pb=document.createElement("span"); pb.className="pinbdg"; pb.textContent="공지"; tl.appendChild(pb);
  }else{
    var cb=document.createElement("span"); cb.className="cat"; cb.textContent=catOf(p); tl.appendChild(cb);
  }
  var tg=tagOf(p);
  if(tg){var tc=document.createElement("span"); tc.className="tagchip"; tc.textContent="$"+tg; tl.appendChild(tc)}
  if(!isPin&&(cmtN(p)>=3||likeN(p)>=3)){
    var hb=document.createElement("span"); hb.className="hotbdg"; hb.textContent="HOT"; tl.appendChild(hb);
  }
  var t=document.createElement("span"); t.className="title"; t.textContent=p.title||"(제목 없음)";
  tl.appendChild(t);
  var cn=cmtN(p);
  if(cn>0){var cc=document.createElement("span"); cc.className="ccount"; cc.textContent="["+cn+"]"; tl.appendChild(cc)}
  main.appendChild(tl);
  var meta=document.createElement("div"); meta.className="meta";
  meta.textContent=(p.name||"익명")+" · "+ago(p.ts)+" · 조회 "+(p.views||0)+" · ♥ "+likeN(p);
  main.appendChild(meta);
  row.appendChild(main);
  row.addEventListener("click",function(){openPost(p.key)});
  return row;
}
function render(){
  renderHot();
  var pins=pinnedPosts(),arr=visiblePosts();
  listEl.textContent="";
  pins.forEach(function(p){listEl.appendChild(makeRow(p,true))});
  var slice=arr.slice(0,shown);
  slice.forEach(function(p){listEl.appendChild(makeRow(p,false))});
  if(!pins.length&&!slice.length){
    var e=document.createElement("div"); e.className="state";
    e.textContent=posts.length?"조건에 맞는 글이 없어요.":"아직 글이 없어요. 첫 글을 써보세요.";
    listEl.appendChild(e);
  }
  countEl.textContent="전체 "+(pins.length+arr.length)+"개 글";
  moreBtn.hidden=arr.length<=shown;
  tagbar.className="tagbar"+(tagFilter?" show":"");
  if(tagFilter)tagLabel.textContent="종목 태그: $"+tagFilter;
}
/* ---------- 상세 ---------- */
function showView(v){
  viewList.hidden=v!=="list"; viewPost.hidden=v!=="post"; viewWrite.hidden=v!=="write";
  $("fab").style.display=(v==="list"&&window.innerWidth<=760)?"flex":"none";
  window.scrollTo(0,0);
}
function openPost(key){
  var p=postByKey(key); if(!p)return;
  curKey=key;
  try{
    var seen=sessionStorage.getItem("kpv_"+key);
    if(!seen){
      sessionStorage.setItem("kpv_"+key,"1");
      firebase.database().ref("posts/"+key+"/views").transaction(function(v){return (typeof v==="number"?v:0)+1});
      p.views=(p.views||0)+1;
    }
  }catch(e){}
  renderPost(p);
  showView("post");
  try{history.replaceState(null,"","#post="+encodeURIComponent(key))}catch(e){}
}
function renderPost(p){
  $("ptitle").textContent=p.title||"(제목 없음)";
  var meta=$("pmeta"); meta.textContent="";
  var parts=[p.name||"익명",fmtFull(p.ts),"조회 "+(p.views||0)];
  var s=document.createElement("span"); s.textContent=parts.join(" · "); meta.appendChild(s);
  var cb=document.createElement("span"); cb.className="cat"; cb.textContent=catOf(p); meta.appendChild(cb);
  var tg=tagOf(p);
  if(tg){
    var tc=document.createElement("button"); tc.type="button"; tc.className="tagchip"; tc.textContent="$"+tg;
    tc.addEventListener("click",function(){tagFilter=tg;shown=PAGE;showView("list");render();try{history.replaceState(null,"","#")}catch(e){}});
    meta.appendChild(tc);
  }
  var box=$("pimgs"); box.textContent="";
  imgsOf(p).forEach(function(src){
    var im=document.createElement("img");
    im.className="pimg"; im.src=src; im.alt=""; im.referrerPolicy="no-referrer"; im.loading="lazy";
    box.appendChild(im);
  });
  $("pbody").textContent=p.body||"";
  var liked=false;
  try{liked=!!localStorage.getItem("kpl_"+p.key)}catch(e){}
  var lb=$("likeBtn");
  lb.textContent="♥ 좋아요 "+likeN(p);
  lb.className="likebtn"+(liked?" on":"");
  var mine=user&&p.uid&&p.uid===user.uid;
  $("editBtn").hidden=!mine; $("delBtn").hidden=!mine;
  renderCmts(p);
}
function renderCmts(p){
  var cmtsEl=$("cmts"); cmtsEl.textContent="";
  var raw=(p.comments&&typeof p.comments==="object")?p.comments:{};
  var arr=Object.keys(raw).map(function(k){
    var v=raw[k]||{};
    return {key:k,text:String(v.text||""),name:String(v.name||"익명"),uid:String(v.uid||""),parent:String(v.parent||""),ts:(typeof v.ts==="number"?v.ts:0)};
  });
  arr.sort(function(a,b){return (a.ts||0)-(b.ts||0)});
  $("chead").textContent="댓글 "+arr.length;
  if(!arr.length){
    var e=document.createElement("p"); e.className="cempty"; e.textContent="아직 댓글이 없습니다. 첫 댓글을 남겨보세요.";
    cmtsEl.appendChild(e); return;
  }
  var byKey={},kids={};
  arr.forEach(function(c){byKey[c.key]=c});
  arr.forEach(function(c){
    var pk=(c.parent&&byKey[c.parent])?c.parent:"";
    if(!kids[pk])kids[pk]=[];
    kids[pk].push(c);
  });
  function addCmt(c,isReply){
    var d=document.createElement("div"); d.className="cmt"+(isReply?" reply":"");
    var n=document.createElement("span"); n.className="cn"; n.textContent=c.name;
    var dt=document.createElement("span"); dt.className="cd"; dt.textContent="  "+ago(c.ts);
    d.appendChild(n); d.appendChild(dt);
    if(user&&c.uid&&c.uid===user.uid){
      var del=document.createElement("button"); del.type="button"; del.className="cdel"; del.textContent="삭제";
      del.addEventListener("click",function(){
        if(!confirm("댓글을 삭제할까요?"))return;
        firebase.database().ref("posts/"+curKey+"/comments/"+c.key).remove().then(function(){
          bumpCount(curKey,-1);
          toast("댓글을 삭제했어요.");
        }).catch(function(){toast("삭제에 실패했어요.")});
      });
      dt.appendChild(document.createTextNode(" · ")); dt.appendChild(del);
    }
    var tx=document.createElement("div"); tx.className="ct"; tx.textContent=c.text;
    d.appendChild(tx);
    var rb=document.createElement("button"); rb.type="button"; rb.className="rbtn"; rb.textContent="답글";
    rb.addEventListener("click",function(){
      if(d.querySelector(".rform"))return;
      var f=document.createElement("form"); f.className="rform";
      var inp=document.createElement("input"); inp.type="text"; inp.maxLength=1000; inp.placeholder="답글을 입력하세요"; inp.autocomplete="off";
      var sb=document.createElement("button"); sb.type="submit"; sb.textContent="등록";
      f.appendChild(inp); f.appendChild(sb);
      f.addEventListener("submit",function(ev){ev.preventDefault();sendComment(inp.value,c.key,function(){refreshPost()})});
      d.appendChild(f); inp.focus();
    });
    d.appendChild(rb);
    cmtsEl.appendChild(d);
    (kids[c.key]||[]).forEach(function(k){addCmt(k,true)});
  }
  (kids[""]||[]).forEach(function(c){addCmt(c,false)});
}
function refreshPost(){
  var p=postByKey(curKey);
  if(p&&!viewPost.hidden)renderPost(p);
  render();
}
function bumpCount(key,delta){
  var p=postByKey(key);
  var ref=firebase.database().ref("posts/"+key+"/cmtCount");
  if(p&&typeof p.cmtCount!=="number"){
    var nv=Math.max(0,cmtN(p)+delta);
    ref.set(nv); p.cmtCount=nv;
  }else{
    ref.transaction(function(v){return Math.max(0,(typeof v==="number"?v:0)+delta)});
  }
}
function requireLogin(){
  if(user)return true;
  toast("로그인이 필요해요.");
  signIn();
  return false;
}
function sendComment(text,parent,done){
  text=(text||"").trim();
  if(!text)return;
  if(!requireLogin())return;
  var rec={text:text,name:myName||user.displayName||"익명",photo:user.photoURL||"",uid:user.uid,parent:parent||"",ts:firebase.database.ServerValue.TIMESTAMP};
  firebase.database().ref("posts/"+curKey+"/comments").push(rec).then(function(){
    bumpCount(curKey,1);
    if(done)done();
  }).catch(function(){$("cerr").hidden=false;$("cerr").textContent="댓글 등록에 실패했어요. 다시 시도해 주세요."});
}
/* ---------- 글쓰기 ---------- */
function fillCats(){
  var sel=$("wcat"); sel.textContent="";
  cmCats.forEach(function(c){
    var o=document.createElement("option"); o.value=c; o.textContent=c; sel.appendChild(o);
  });
}
function openWrite(edit){
  if(!requireLogin())return;
  editKey=edit||null;
  fillCats();
  $("werr").hidden=true;
  if(edit){
    var p=postByKey(edit); if(!p)return;
    $("wcat").value=catOf(p);
    $("wtitle").value=p.title||"";
    $("wtag").value=tagOf(p);
    $("wbody").value=p.body||"";
    $("wimgs").value=imgsOf(p).join("\n");
    $("wsubmit").textContent="수정하기";
  }else{
    $("wtitle").value=""; $("wtag").value=""; $("wbody").value=""; $("wimgs").value="";
    $("wsubmit").textContent="등록하기";
  }
  showView("write");
}
/* ---------- 인증 ---------- */
var authReady=false;
function signIn(){
  var prov=new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(prov).catch(function(){toast("로그인에 실패했어요.")});
}
function syncAuthBtn(){
  var b=$("authBtn");
  if(user){b.textContent=(myName||"내 계정")+" · 로그아웃"; b.className="authbtn on"}
  else{b.textContent="로그인"; b.className="authbtn"}
}
/* ---------- 이벤트 ---------- */
sortEl.addEventListener("change",function(){sortMode=sortEl.value;shown=PAGE;render()});
moreBtn.addEventListener("click",function(){shown+=PAGE;render()});
qEl.addEventListener("input",function(){query=qEl.value.trim();shown=PAGE;render()});
$("tagClear").addEventListener("click",function(){tagFilter="";render()});
$("backBtn").addEventListener("click",function(){curKey=null;showView("list");render();try{history.replaceState(null,"","#")}catch(e){}});
$("wbackBtn").addEventListener("click",function(){showView(curKey?"post":"list")});
$("wcancel").addEventListener("click",function(){showView(curKey?"post":"list")});
$("writeBtn").addEventListener("click",function(){openWrite(null)});
$("fab").addEventListener("click",function(){openWrite(null)});
$("editBtn").addEventListener("click",function(){if(curKey)openWrite(curKey)});
$("delBtn").addEventListener("click",function(){
  if(!curKey)return;
  if(!confirm("이 글을 삭제할까요?"))return;
  firebase.database().ref("posts/"+curKey).remove().then(function(){
    curKey=null; showView("list"); toast("글을 삭제했어요.");
  }).catch(function(){toast("삭제에 실패했어요.")});
});
$("likeBtn").addEventListener("click",function(){
  if(!curKey)return;
  var liked=false;
  try{liked=!!localStorage.getItem("kpl_"+curKey)}catch(e){}
  if(liked){toast("이미 좋아요를 눌렀어요.");return}
  firebase.database().ref("posts/"+curKey+"/likes").transaction(function(v){return (typeof v==="number"?v:0)+1}).then(function(){
    try{localStorage.setItem("kpl_"+curKey,"1")}catch(e){}
    var p=postByKey(curKey); if(p){p.likes=likeN(p)+1; renderPost(p); render()}
  }).catch(function(){toast("좋아요에 실패했어요.")});
});
$("cform").addEventListener("submit",function(e){
  e.preventDefault();
  $("cerr").hidden=true;
  sendComment($("cinput").value,"",function(){$("cinput").value="";refreshPost()});
});
$("wform").addEventListener("submit",function(e){
  e.preventDefault();
  if(!requireLogin())return;
  var title=$("wtitle").value.trim(),body=$("wbody").value.trim();
  var err=$("werr");
  if(!title){err.hidden=false;err.textContent="제목을 입력해 주세요.";return}
  if(!body){err.hidden=false;err.textContent="내용을 입력해 주세요.";return}
  var tag=$("wtag").value.trim().toUpperCase().replace(/^\$/,"").replace(/[^0-9A-Z가-힣.\-]/g,"").slice(0,12);
  var imgs=$("wimgs").value.split("\n").map(function(s){return s.trim()}).filter(function(s){return /^https?:\/\//.test(s)}).slice(0,4);
  var rec={title:title,body:body,cat:$("wcat").value,name:myName||user.displayName||"익명",photo:user.photoURL||"",uid:user.uid};
  if(tag)rec.tag=tag;
  if(imgs.length)rec.imgs=imgs;
  var db=firebase.database();
  if(editKey){
    rec.editedAt=firebase.database.ServerValue.TIMESTAMP;
    db.ref("posts/"+editKey).update(rec).then(function(){
      var p=postByKey(editKey);
      if(p){for(var k in rec){if(k!=="editedAt")p[k]=rec[k]} if(!tag)delete p.tag; if(!imgs.length)delete p.imgs}
      editKey=null; toast("글을 수정했어요."); if(curKey)renderPost(postByKey(curKey)); showView(curKey?"post":"list"); render();
    }).catch(function(){err.hidden=false;err.textContent="수정에 실패했어요."});
  }else{
    rec.ts=firebase.database.ServerValue.TIMESTAMP;
    rec.views=0; rec.likes=0; rec.cmtCount=0;
    db.ref("posts").push(rec).then(function(ref){
      toast("글이 등록됐어요.");
      showView("list");
    }).catch(function(){err.hidden=false;err.textContent="등록에 실패했어요. 다시 시도해 주세요."});
  }
});
$("authBtn").addEventListener("click",function(){
  if(user){firebase.auth().signOut()}
  else signIn();
});
/* ---------- 시작 ---------- */
function fail(){
  listEl.textContent="";
  var e=document.createElement("div"); e.className="state";
  e.textContent="글을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.";
  var b=document.createElement("button"); b.type="button"; b.textContent="다시 시도";
  b.addEventListener("click",function(){location.reload()});
  e.appendChild(document.createElement("br")); e.appendChild(b);
  listEl.appendChild(e);
}
try{
  firebase.initializeApp(FIREBASE_CONFIG);
  var db=firebase.database();
  firebase.auth().onAuthStateChanged(function(u){
    user=u||null; authReady=true;
    if(user){
      db.ref("users/"+user.uid).once("value").then(function(s){
        var v=s.val()||{};
        myName=v.name||v.nick||user.displayName||"익명";
        syncAuthBtn();
      }).catch(function(){myName=user.displayName||"익명"; syncAuthBtn()});
    }else{myName=""; syncAuthBtn()}
    refreshPost();
  });
  db.ref("cmConfig/cats").once("value").then(function(snap){
    var v=snap.val();
    if(v&&typeof v==="object"){
      var arr=Object.prototype.toString.call(v)==="[object Array]"?v:Object.keys(v).sort().map(function(k){return v[k]});
      arr=arr.filter(function(x){return typeof x==="string"&&x.trim()});
      if(arr.length)cmCats=arr;
    }
  }).catch(function(){}).then(function(){
    renderChips();
    db.ref("posts").on("value",function(snap){
      var val=snap.val()||{};
      posts=Object.keys(val).map(function(k){
        var p=val[k]||{}; p.key=k; return p;
      });
      render();
      if(curKey)refreshPost();
      var h=location.hash||"";
      if(h.indexOf("#post=")===0&&viewPost.hidden){
        var k=decodeURIComponent(h.slice(6));
        if(postByKey(k))openPost(k);
      }
    },function(){fail()});
  }).catch(function(){fail()});
}catch(e){fail()}
})();
</script>
</body>
</html>
